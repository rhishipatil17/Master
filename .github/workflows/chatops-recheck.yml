name: "ChatOps: Recheck"

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  re-run-workflows:
    # Catch "recheck" regardless of capitalization
    if: ${{ github.event.issue.pull_request && contains(tolower(github.event.comment.body), 'recheck') }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-trigger PR Checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}
          
          echo "Looking up branch name for PR #$PR_NUMBER..."
          
          # 1. Get the branch name from the PR number
          BRANCH_NAME=$(gh pr view $PR_NUMBER --repo $REPO --json headRefName --jq .headRefName)

          echo "Found branch: $BRANCH_NAME. Fetching workflow runs..."

          # 2. Get workflow runs for that specific branch, filtered by pull_request events
          RUN_IDS=$(gh run list --branch "$BRANCH_NAME" --repo $REPO --event pull_request --json databaseId --jq '.[].databaseId')
          
          if [ -z "$RUN_IDS" ]; then
            echo "No previous workflow runs found to re-trigger."
            exit 0
          fi
          
          # 3. Loop through and restart them
          for ID in $RUN_IDS; do
            echo "Attempting to re-run workflow ID: $ID"
            gh run rerun $ID || echo "⚠️ Could not restart $ID (it may already be running or completed successfully)."
          done
